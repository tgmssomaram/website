<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal | TGMS Somaram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css?v=2.1.0" />
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="login-screen">
    <div class="login-card">
      <img src="/images/telangana-emblem-trimmed.svg" alt="TGMS Emblem" class="login-logo" />
      <h1 class="login-title">TGMS Somaram — Admin Portal</h1>
      <p class="login-subtitle">Sign in to manage announcements, gallery, and faculty</p>

      <form id="login-form">
        <div class="form-group">
          <label for="admin-email">Email Address</label>
          <input
            type="email"
            id="admin-email"
            value="tgmssomaram.knr@gmail.com"
            placeholder="tgmssomaram.knr@gmail.com"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="admin-password">Password</label>
          <input
            type="password"
            id="admin-password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button id="login-btn" class="btn-primary" type="submit">Sign In to Dashboard</button>
      </form>

      <div id="login-spinner" class="spinner" aria-hidden="true"></div>
      <div id="login-error" role="alert"></div>
    </div>
  </div>

  <!-- ===== DASHBOARD SCREEN ===== -->
  <div id="dashboard-screen" class="hidden">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="/images/telangana-emblem-trimmed.svg" alt="TGMS Emblem" />
        <div class="sidebar-brand-text">
          <h2>TGMS Somaram</h2>
          <span>Admin Portal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a data-section="dashboard" class="active">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a data-section="notices">
          <span class="nav-icon">📢</span>
          <span>Flash News &amp; Notices</span>
        </a>
        <a data-section="faculty">
          <span class="nav-icon">👨‍🏫</span>
          <span>Faculty Manager</span>
        </a>
        <a data-section="gallery">
          <span class="nav-icon">🖼️</span>
          <span>Gallery &amp; Photos</span>
        </a>
        <a data-section="inquiries">
          <span class="nav-icon">📬</span>
          <span>Inquiries</span>
        </a>
        <a data-section="profile">
          <span class="nav-icon">🏫</span>
          <span>School Profile</span>
        </a>
        <a data-section="settings">
          <span class="nav-icon">⚙️</span>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" type="button">🚪 Sign Out</button>
      </div>
    </aside>

    <!-- Main area -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button id="sidebar-toggle" type="button" aria-label="Toggle sidebar">☰</button>
          <span id="topbar-title" style="font-weight:700;color:var(--text-primary);font-size:1.15rem;">Dashboard</span>
        </div>
        <div class="topbar-right">
          <a href="/" target="_blank" class="topbar-live-link">
            <span>View Live Website</span>
            <span>↗</span>
          </a>
        </div>
      </header>

      <div id="admin-view" class="admin-view"></div>
    </div>

  </div><!-- /#dashboard-screen -->

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Admin Scripts with Cache-Buster -->
  <script type="text/javascript" src="/js/admin/api.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/auth.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/dashboard.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/notices.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/faculty.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/gallery.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/inquiries.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/profile.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/settings.js?v=2.1.0"></script>
  <script type="text/javascript" src="/js/admin/app.js?v=2.1.0"></script>
</body>
</html>
